sonar.projectKey=monicastefanuca3-coder_taskflow
sonar.organization=monicastefanuca3-coder
sonar.projectName=TaskFlow
sonar.projectVersion=1.0

# Codul sursă de analizat
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Excluderi — nu scanăm dependențe, date generate sau fișiere statice
sonar.exclusions=node_modules/**,public/uploads/**,public/css/**,data/**,.github/**

# JavaScript simplu (CommonJS, fără build step) — nu există teste/coverage de raportat
sonar.javascript.lcov.reportPaths=

# Proiectul demonstrativ nu are teste unitare; acoperirea nu e un indicator de securitate
sonar.coverage.exclusions=**/*
sonar.qualitygate.wait=true
