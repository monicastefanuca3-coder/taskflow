name: Security Pipeline

on:
  push:
    branches: [main, fixed]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) SECRET SCANNING — TruffleHog (mod git = include istoricul)
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog — scanează istoricul git
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:3.88.0 \
            git file:///repo --fail --no-update \
            --exclude-paths=/repo/.trufflehog-exclude.txt 2>&1 | tee trufflehog.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-report
          path: trufflehog.txt

  # 2) SCA — dependențe
  sca-dependencies:
    name: SCA — Dependențe (npm audit + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: "npm audit (gate high+)"
        run: npm audit --audit-level=high

      - name: Trivy fs — gate HIGH/CRITICAL
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          skip-dirs: node_modules

      - name: Trivy fs — raport SARIF
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
          skip-dirs: node_modules

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # 3) SCA — imagine Docker
  sca-container:
    name: SCA — Imagine Docker (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build imagine Docker
        run: docker build -t taskflow:scan .

      - name: Trivy image — gate HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: taskflow:scan
          format: table
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy image — raport SARIF
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: taskflow:scan
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # 4) SAST — SonarQube / SonarCloud
  sast:
    name: SAST (SonarQube)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 5) DAST — OWASP ZAP
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalează dependențele
        run: |
          rm -rf node_modules
          npm install
          npm rebuild sqlite3 --build-from-source

      - name: Pornește aplicația
        run: |
          nohup node server.js > app.log 2>&1 &
          npx wait-on http://localhost:3000/health --timeout 30000

      - name: ZAP Baseline (pasiv)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000/login'
          cmd_options: '-a'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: ZAP Full Scan (activ) pe login
        if: always()
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:3000/login'
          cmd_options: '-a -T 5'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-full-report

      - name: Log aplicație (debug)
        if: failure()
        run: cat app.log

  # 6) Sumar
  summary:
    name: Sumar pipeline
    runs-on: ubuntu-latest
    needs: [secret-scan, sca-dependencies, sca-container, sast, dast]
    if: always()
    steps:
      - name: Tabel rezultate + gate final
        run: |
          {
            echo "## Rezultate Security Pipeline"
            echo "| Etapă | Rezultat |"
            echo "|---|---|"
            echo "| Secret scanning | ${{ needs.secret-scan.result }} |"
            echo "| SCA dependențe | ${{ needs.sca-dependencies.result }} |"
            echo "| SCA imagine | ${{ needs.sca-container.result }} |"
            echo "| SAST | ${{ needs.sast.result }} |"
            echo "| DAST | ${{ needs.dast.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Cel puțin o etapă de securitate a eșuat."
            exit 1
          fi